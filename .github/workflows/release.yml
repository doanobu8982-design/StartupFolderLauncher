name: Clean Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. C# ソースコードの自動クリーンコンパイル（launcher.exe & 管理画面を開く.exe）
      - name: Compile C# Sources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cscPath = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"

          Write-Host "Compiling launcher.exe ..."
          & $cscPath /nologo /target:winexe /optimize+ /out:launcher.exe scripts\launcher.cs
          if ($LASTEXITCODE -ne 0) { throw "launcher.cs のコンパイルに失敗しました。" }

          Write-Host "Compiling 管理画面を開く.exe ..."
          & $cscPath /nologo /target:winexe /optimize+ /out:"管理画面を開く.exe" scripts\open_gui.cs
          if ($LASTEXITCODE -ne 0) { throw "open_gui.cs のコンパイルに失敗しました。" }

      # 2. 配布用クリーンポータブルZIPパッケージとSHA-256チェックサムの生成
      - name: Create Clean ZIP and Checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $repoName = ($env:GITHUB_REPOSITORY -split '/')[1]
          $tagName = $env:GITHUB_REF_NAME
          $zipName = "${repoName}_${tagName}.zip"

          New-Item -ItemType Directory -Force -Path "dist/package" | Out-Null

          # 公開用クリーンファイルをパッケージフォルダへ集約
          Get-ChildItem -Path . -Exclude ".git", ".github", ".gitignore", "dist" |
            Copy-Item -Destination "dist/package" -Recurse -Force

          # ZIP 圧縮
          Compress-Archive -Path "dist/package/*" -DestinationPath "dist/$zipName"

          # SHA-256 ハッシュ生成
          $hash = (Get-FileHash "dist/$zipName" -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Out-File -FilePath "dist/checksums.txt" -Encoding utf8

      # 3. GitHub Releases への自動公開
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/checksums.txt
